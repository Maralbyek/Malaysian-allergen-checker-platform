version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: allergy-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: allergy_management
      MYSQL_USER: allergyuser
      MYSQL_PASSWORD: allergypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - allergy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: allergy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      PMA_USER: allergyuser
      PMA_PASSWORD: allergypassword
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - allergy-network

networks:
  allergy-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
